version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: xiran-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-xiran_platform}
      MYSQL_USER: ${MYSQL_USER:-xiran}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiran_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xiran-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: xiran-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-xiran_platform}
      MYSQL_USER: ${MYSQL_USER:-xiran}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiran_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      XIRAN_JWT_SECRET: ${XIRAN_JWT_SECRET:-change_this_secret_in_production}
      XIRAN_ACCESS_TOKEN_EXPIRATION: ${XIRAN_ACCESS_TOKEN_EXPIRATION:-3600000}
      XIRAN_REFRESH_TOKEN_EXPIRATION: ${XIRAN_REFRESH_TOKEN_EXPIRATION:-604800000}
      XIRAN_CORS_ALLOWED_ORIGINS: ${XIRAN_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:
  redis_data:
