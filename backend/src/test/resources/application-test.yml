spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: never

xiran:
  jwt:
    secret: test_secret_key_for_unit_test_only_at_least_32_chars
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
