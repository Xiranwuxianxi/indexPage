spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:xiran_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:xiran}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  sql:
    init:
      mode: never

server:
  port: 8080
  # 部署在 Nginx 之后：信任 X-Forwarded-*，使 CORS 同源判断、重定向使用真实域名/协议/端口
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    # 生产不向 stdout 打印每条 SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: info
    com.xiran.platform: info

xiran:
  jwt:
    secret: ${XIRAN_JWT_SECRET:}
    access-token-expiration: ${XIRAN_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${XIRAN_REFRESH_TOKEN_EXPIRATION:604800000}
  cors:
    allowed-origins: ${XIRAN_CORS_ALLOWED_ORIGINS:}
